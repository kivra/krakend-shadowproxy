---
name: ci
permissions:
  pull-requests: read

on:
  push:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

    - name: Run linter
      shell: 'script -q -e -c "bash {0}"'
      run: make lint

    - name: Run tests
      shell: 'script -q -e -c "bash {0}"'
      run: make test
